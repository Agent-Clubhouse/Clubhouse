version: 2
updates:
  # One grouped PR per ecosystem per week: ungrouped npm bumps all edit
  # package-lock.json and conflict pairwise, cascading into rebase churn.
  # Every ecosystem carries the same 7-day cooldown: let routine releases
  # age before adoption. Security updates bypass cooldown automatically
  # (a dependabot behavior, not something set here).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # OpenTelemetry moves as one release train (api 1.9.x, stable SDKs
      # 2.10.0, experimental 0.221.x) in lockstep with the pre-1.0 Azure
      # exporter; the OTLP exporters pin the stable SDKs exactly, so a partial
      # bump installs duplicate copies. Listed before the catch-all so these
      # land in their own PR (docs/telemetry-otel-spec.md §6.3).
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
          - "@azure/monitor-opentelemetry-exporter"
      npm:
        patterns:
          - "*"
    # Majors that need a deliberate migration before they can land; each entry
    # broke CI when dependabot proposed it. Remove an entry once its blocker
    # is cleared.
    ignore:
      # typescript-eslint peer-requires typescript <6.1.0, and TS 6 makes our
      # baseUrl + moduleResolution=node10 tsconfig options hard errors.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # jsdom 30's selector engine stops matching camelCase SVG attributes
      # (svg[viewBox=...], animate[attributeName=...]) used by our tests.
      - dependency-name: "jsdom"
        versions: [">=29.0.0"]
      # Vitest 5 rejects our existing nested mock declarations and changes
      # protocol-client timing behavior; migrate the suite before upgrading.
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5.0.0"]
      # ESLint 10's new preserve-caught-error / no-useless-assignment rules
      # produce 19 errors; fix the code before adopting. @eslint/js is
      # versioned in lockstep with eslint.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      # @electron-forge/plugin-fuses still peer-requires @electron/fuses v1
      # (also comment-ignored on the PR; kept here for visibility).
      - dependency-name: "@electron/fuses"
        versions: [">=2.0.0"]
      # monaco-editor 0.56's typings field points at a file missing from the
      # published tarball, so it typechecks as untyped under our
      # moduleResolution=node; this also defers the dompurify XSS advisory fix,
      # because `npm audit fix --force` pulls in monaco-editor@0.56.0 and needs
      # the exports-aware resolution migration (same work as the TypeScript 6
      # move).
      - dependency-name: "monaco-editor"
        versions: [">=0.56.0"]
      # The electron-forge webpack template pins this exact version for a
      # reason: newer releases inject `__webpack_require__.ab = __dirname +
      # "/native_modules/"` unguarded into web-target bundles, which throws
      # ReferenceError in the renderer and blank-screens the app at launch.
      - dependency-name: "@vercel/webpack-asset-relocator-loader"
        versions: [">1.7.3"]
      # Electron and its Forge packages require coordinated Chromium, native
      # module, and packaging migrations before adopting a new major version.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@electron-forge/*"
        versions: [">=8.0.0"]
      # The OTel packages and the Azure exporter move as one pinned train
      # (docs/telemetry-otel-spec.md §6.3): exporter 1.0.0-beta.46 needs
      # sdk-logs/api-logs ^0.221.0 (a 0.x caret pins the minor), and the OTLP
      # exporters 0.221 pin the stable SDKs to exactly 2.10.0. Any bump past
      # these installs a second SDK copy (see #1940). Upgrade the whole train
      # by hand when the exporter accepts a newer one, and raise these together.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@azure/monitor-opentelemetry-exporter"
        versions: [">1.0.0-beta.46"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=2.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        versions: [">=2.11.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=2.11.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=2.11.0"]
      - dependency-name: "@opentelemetry/core"
        versions: [">=2.11.0"]
      - dependency-name: "@opentelemetry/context-async-hooks"
        versions: [">=2.11.0"]
      - dependency-name: "@opentelemetry/sdk-logs"
        versions: [">=0.222.0"]
      - dependency-name: "@opentelemetry/api-logs"
        versions: [">=0.222.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.222.0"]
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-http"
        versions: [">=0.222.0"]
      - dependency-name: "@opentelemetry/exporter-logs-otlp-http"
        versions: [">=0.222.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

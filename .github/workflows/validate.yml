# DIAG ONLY: do not merge. Repro matrix for #fix-release-msg-win.
# Runs the full unit suite on Windows at v0.41.0 and at #1900's head,
# repeated, then times bash spawns AFTER the suite (so the suite sees the
# same cold bash state that real CI does).
name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  repro:
    name: repro (${{ matrix.ref }} #${{ matrix.rep }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.41.0, 85e1af2c0]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref == '85e1af2c0' && 'refs/pull/1900/head' || matrix.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Environment (no bash execution)
        shell: pwsh
        run: |
          git rev-parse HEAD
          where.exe bash
          (Get-Command bash -All).Source
          $env:PATH -split ';'
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AMRunningMode,AntivirusSignatureLastUpdated | Format-List
      - run: npm ci
      - run: npm test -- --reporter=junit --reporter=default --outputFile.junit=test-results.xml
      - name: Extract test time
        if: always()
        shell: pwsh
        run: |
          Select-String -Path test-results.xml -Pattern 'shell-special[^"]*" time="[^"]*"' | ForEach-Object { $_.Matches.Value }
      - name: Bash spawn timing after suite
        if: always()
        run: |
          node -e "const {execFileSync}=require('child_process');for(let i=0;i<10;i++){const t=process.hrtime.bigint();execFileSync('bash',['-c','true'],{env:process.env});console.log('spawn',i,Number(process.hrtime.bigint()-t)/1e6,'ms')}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-${{ matrix.ref }}-${{ matrix.rep }}
          path: test-results.xml

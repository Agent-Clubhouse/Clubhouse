# LOCALLY APPROVED CONTROL CANDIDATE. PUSH/DISPATCH NOT AUTHORIZED.
# Proposed location on an isolated, non-main, no-PR control branch:
# .github/workflows/validate.yml (already dispatchable on the default branch).
# Manifest runnable=true; WAIT parent approval of actual CONTROL SHA/ref and ONE dispatch.
name: Windows query observation (not release validation)

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Reviewed immutable control commit SHA
        required: true
        type: string
      expected_capture_sha:
        description: Reviewed immutable historical-merge-plus-four-files commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-query-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: Native Windows stdout and exit parity (diagnostic only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      EXPECTED_CAPTURE_SHA: ${{ inputs.expected_capture_sha }}
    outputs:
      capture_sha: ${{ steps.gate.outputs.capture_sha }}
      capture_tree: ${{ steps.gate.outputs.capture_tree }}
      reviewed_blobs: ${{ steps.gate.outputs.reviewed_blobs }}
      unchanged_blobs: ${{ steps.gate.outputs.unchanged_blobs }}
      image_version: ${{ steps.gate.outputs.image_version }}
      os_release: ${{ steps.gate.outputs.os_release }}
      node_version: ${{ steps.gate.outputs.node_version }}
      npm_version: ${{ steps.gate.outputs.npm_version }}
    steps:
      - name: Reject moved control ref or a rerun before checkout
        run: |
          node -e 'const e=process.env;const ok=e.GITHUB_REPOSITORY==="Agent-Clubhouse/Clubhouse"&&e.GITHUB_EVENT_NAME==="workflow_dispatch"&&e.GITHUB_RUN_ATTEMPT==="1"&&/^[a-f0-9]{40}$/.test(e.EXPECTED_CONTROL_SHA||"")&&e.EXPECTED_CONTROL_SHA===e.GITHUB_SHA&&/^[a-f0-9]{40}$/.test(e.EXPECTED_CAPTURE_SHA||"");if(!ok){console.error(JSON.stringify({ok:false,failure:"dispatch_guard_rejected"}));process.exit(1)}'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Validate approved manifest and control identity
        id: gate
        env:
          PARITY_MODE: gate
        run: node .diagnostics/windows-query-parity.cjs
      - name: Checkout only the immutable source for private parity
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.gate.outputs.capture_sha }}
          path: candidate
          persist-credentials: false
      - name: Five native parity cases then private real-CIM sanity
        id: parity
        env:
          PARITY_MODE: parity
        run: node .diagnostics/windows-query-parity.cjs
      - name: Retain sanitized parity receipt only
        if: ${{ always() && steps.parity.outcome != 'skipped' && steps.parity.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-query-parity-sanitized
          path: diagnostic-receipts/parity.json
          if-no-files-found: error
          retention-days: 2

  capture:
    name: ONE fresh Windows1 observation (not release validation)
    needs: parity
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.parity.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      EXPECTED_CAPTURE_INPUT: ${{ inputs.expected_capture_sha }}
      EXPECTED_CAPTURE_SHA: ${{ needs.parity.outputs.capture_sha }}
      EXPECTED_CAPTURE_TREE: ${{ needs.parity.outputs.capture_tree }}
      EXPECTED_REVIEWED_BLOBS: ${{ needs.parity.outputs.reviewed_blobs }}
      EXPECTED_UNCHANGED_BLOBS: ${{ needs.parity.outputs.unchanged_blobs }}
      EXPECTED_IMAGE_VERSION: ${{ needs.parity.outputs.image_version }}
      EXPECTED_OS_RELEASE: ${{ needs.parity.outputs.os_release }}
      EXPECTED_NODE_VERSION: ${{ needs.parity.outputs.node_version }}
      EXPECTED_NPM_VERSION: ${{ needs.parity.outputs.npm_version }}
    steps:
      - name: Reject moved control ref or invalid parity outputs before source checkout
        shell: cmd
        run: >-
          node -e "const e=process.env;const hex=/^[a-f0-9]{40}$/;const ok=e.GITHUB_REPOSITORY==='Agent-Clubhouse/Clubhouse'&&e.GITHUB_EVENT_NAME==='workflow_dispatch'&&e.GITHUB_RUN_ATTEMPT==='1'&&hex.test(e.EXPECTED_CONTROL_SHA||'')&&e.EXPECTED_CONTROL_SHA===e.GITHUB_SHA&&hex.test(e.EXPECTED_CAPTURE_SHA||'')&&hex.test(e.EXPECTED_CAPTURE_TREE||'')&&e.EXPECTED_CAPTURE_INPUT===e.EXPECTED_CAPTURE_SHA;if(ok===false){console.error(JSON.stringify({ok:false,failure:'capture_dispatch_guard_rejected'}));process.exit(1)}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.parity.outputs.capture_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify source tree and runtime with no additional PowerShell or CIM warmup
        id: identity
        shell: cmd
        run: >-
          node -e "const fs=require('node:fs'),os=require('node:os'),cp=require('node:child_process'),e=process.env;const out={purpose:'diagnostic-only',ok:false};function check(ok,code){if(ok===false)throw Object.assign(new Error(code),{fixedCode:code})}function git(args){return cp.execFileSync('git',args,{encoding:'utf8',windowsHide:true,stdio:['ignore','pipe','pipe']}).trim()}function config(key,allowed){const r=cp.spawnSync('git',['config','--get',key],{encoding:'utf8',windowsHide:true,stdio:['ignore','pipe','pipe']});check(r.error===undefined&&(r.status===0||r.status===1),'checkout_config_unreadable');if(r.status===1)return 'unset';const v=r.stdout.trim();check(allowed.includes(v),'checkout_config_rejected');return v}try{check(git(['rev-parse','HEAD'])===e.EXPECTED_CAPTURE_SHA,'source_sha_rejected');check(git(['rev-parse','HEAD^{tree}'])===e.EXPECTED_CAPTURE_TREE,'source_tree_rejected');const tables=[JSON.parse(e.EXPECTED_REVIEWED_BLOBS),JSON.parse(e.EXPECTED_UNCHANGED_BLOBS)],names=tables.flatMap(t=>Object.keys(t));check(names.length===8&&new Set(names).size===8,'source_conversion_rejected');const attrs=git(['check-attr','-z','filter','working-tree-encoding','--',...names]).split('\0');check(attrs.pop()===''&&attrs.length===names.length*6,'source_conversion_rejected');const seen=new Set();for(let i=0;i<attrs.length;i+=3){check(names.includes(attrs[i])&&['filter','working-tree-encoding'].includes(attrs[i+1])&&['unspecified','unset'].includes(attrs[i+2]),'source_conversion_rejected');const k=attrs[i]+'\0'+attrs[i+1];check(seen.has(k)===false,'source_conversion_rejected');seen.add(k)}for(const table of tables)for(const [name,sha]of Object.entries(table))check(git(['hash-object','--path='+name,'--',name])===sha,'source_blob_rejected');check(process.platform==='win32'&&os.release()===e.EXPECTED_OS_RELEASE,'os_drift');check(e.ImageVersion===e.EXPECTED_IMAGE_VERSION,'image_drift');check(process.version===e.EXPECTED_NODE_VERSION,'node_drift');const npm=cp.execFileSync('cmd.exe',['/d','/s','/c','npm --version'],{encoding:'utf8',windowsHide:true,stdio:['ignore','pipe','pipe']}).trim();check(npm===e.EXPECTED_NPM_VERSION,'npm_drift');Object.assign(out,{ok:true,sourceSha:e.EXPECTED_CAPTURE_SHA,sourceTree:e.EXPECTED_CAPTURE_TREE,imageVersion:e.ImageVersion,osRelease:os.release(),nodeVersion:process.version,npmVersion:npm,availableParallelism:os.availableParallelism(),checkoutProof:'git-clean-filtered-blobs',sourceConversionSafe:true,coreAutocrlf:config('core.autocrlf',['true','false','input']),coreEol:config('core.eol',['lf','crlf','native'])})}catch(error){const allowed=new Set(['source_sha_rejected','source_tree_rejected','source_blob_rejected','source_conversion_rejected','os_drift','image_drift','node_drift','npm_drift','checkout_config_unreadable','checkout_config_rejected']);out.failure=allowed.has(error.fixedCode)?error.fixedCode:'identity_internal_failure';process.exitCode=1}const summary=JSON.stringify(out);try{fs.mkdirSync('diagnostic-receipts',{recursive:true});fs.writeFileSync('diagnostic-receipts/capture-runtime.json',summary+'\n')}catch{console.error(JSON.stringify({ok:false,failure:'receipt_write_failed'}));process.exitCode=1}console.log(summary);"
      - run: npm ci
      - name: Original Windows1 command ONCE with unchanged projects, workers, and deadlines
        run: npm test -- --shard=1/2 --passWithNoTests --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Retain fixed JUnit and sanitized runtime receipt only
        if: ${{ always() && steps.identity.outcome != 'skipped' && steps.identity.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows1-query-observation-not-release-validation
          path: |
            test-results.xml
            diagnostic-receipts/capture-runtime.json
          if-no-files-found: error
          retention-days: 2

name: Stable candidate

# Packages candidate_sha as a stable version and launches it on hosted runners,
# to check the Preview gates in a real packaged build. See docs/ci.md.
#
# A file of its own because dispatching validate.yml runs its complete matrix
# (`changes` sets complete=true for workflow_dispatch). Dispatch is the only
# trigger here: no pull_request, push, schedule or label can start it.
#
# Never signs, notarizes or publishes, and uploads no build: results, provenance
# and logs only. Uses no secrets and no environment.
#
# Two checkouts. The harness (the script and its checks) is this workflow's own
# revision. The app is packaged only from candidate/, at candidate_sha, so a harness
# fix doesn't move the candidate and the candidate can't change the checks.

on:
  workflow_dispatch:
    inputs:
      stable_candidate:
        description: Package as a stable version and launch it on hosted runners
        required: true
        type: boolean
        default: false
      candidate_sha:
        description: Full 40-character SHA of the commit on main to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_candidate == true }}
    name: Stable candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      STABLE_CANDIDATE: ${{ inputs.stable_candidate }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: see the pin in validate.yml (#1652).
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - name: Check out the harness (this workflow's revision)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      # No npm cache: nothing from an earlier run goes into this build.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Check the inputs
        run: node harness/scripts/ci/stable-candidate.mjs --check-input
      # Full history, so the commit can be checked against main.
      - name: Check out the candidate
        id: candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check the candidate is that commit, on main
        run: node harness/scripts/ci/stable-candidate.mjs --verify-candidate
      - run: npm ci
        working-directory: candidate
      - name: Package and launch
        if: runner.os != 'Linux'
        working-directory: candidate
        run: node ../harness/scripts/ci/stable-candidate.mjs
      - name: Package and launch (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: candidate
        run: xvfb-run --auto-servernum node ../harness/scripts/ci/stable-candidate.mjs
      - name: Check package.json was restored
        if: always() && steps.candidate.outcome == 'success'
        working-directory: candidate
        run: git diff --exit-code -- package.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stable-candidate-${{ matrix.os }}-${{ inputs.candidate_sha }}
          path: stable-candidate-results/
          retention-days: 7
          if-no-files-found: error

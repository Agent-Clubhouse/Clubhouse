name: Chat handshake (nightly)

# Zero-token check that each chat driver still completes its protocol
# handshake with the pinned CLI. There are no CLI credentials in CI, so this
# replaces the old real-CLI E2E job: it needed CLI logins CI does not have,
# and it had been failing at setup every night behind continue-on-error.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-handshake-nightly
  cancel-in-progress: false

jobs:
  # Zero-token protocol handshake for every chat driver (docs/structured-chat-research.md
  # §8 decision 4), including both Copilot drivers (ACP and SDK). Each driver's
  # probe() spawns the pinned CLI, completes the handshake and exits: no prompt is sent and no credentials are
  # configured, so nothing can spend tokens. Pins match testedMax in
  # chat-version-policy.ts TESTED_CLI_VERSIONS; raise them together. After the
  # handshake, the fake-model smoke runs the Dispatcher flow against a model server
  # on 127.0.0.1 and checks ignoresToolListChanged still matches the CLI.
  chat-handshake:
    name: chat handshake (${{ matrix.provider }}, zero tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude-code
            package: '@anthropic-ai/claude-code'
            version: '2.1.316'
          - provider: codex-cli
            package: '@openai/codex'
            version: '0.166.0'
          - provider: copilot-cli
            package: '@github/copilot'
            version: '1.0.105'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned CLI
        shell: bash
        run: npm install -g "${{ matrix.package }}@${{ matrix.version }}"

      - name: Handshake only (no prompt)
        shell: bash
        env:
          CLUBHOUSE_CHAT_HANDSHAKE_SMOKE: '1'
          CLUBHOUSE_CHAT_HANDSHAKE_PROVIDERS: ${{ matrix.provider }}
          CLUBHOUSE_CHAT_HANDSHAKE_REPORT: ${{ runner.temp }}/chat-handshake.json
        run: npx vitest run src/main/chat/handshake-smoke.test.ts

      - name: Dispatcher flow against a local fake model (no paid requests)
        shell: bash
        env:
          CLUBHOUSE_FAKE_MODEL_SMOKE: '1'
          CLUBHOUSE_FAKE_MODEL_PROVIDERS: ${{ matrix.provider }}
          CLUBHOUSE_FAKE_MODEL_REPORT: ${{ runner.temp }}/fake-model.json
        run: |
          CLUBHOUSE_FAKE_MODEL_BIN_DIR="$(npm prefix -g)/bin" npx vitest run src/main/chat/fake-model-smoke.test.ts

      - name: Publish handshake summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/chat-handshake.json
          FAKE_REPORT: ${{ runner.temp }}/fake-model.json
        run: |
          {
            echo "## Chat handshake: ${{ matrix.provider }} (pinned ${{ matrix.version }})"
            if [ -f "$REPORT" ]; then
              node -e '
                const rows = JSON.parse(require("fs").readFileSync(process.env.REPORT, "utf8"));
                console.log("| driver | handshake | CLI version | version policy | ms | error |");
                console.log("|---|---|---|---|---|---|");
                for (const r of rows) console.log(`| ${r.driver} | ${r.handshakeOk ? "ok" : "FAILED"} | ${r.cliVersion ?? "?"} | ${r.versionStatus ?? "?"} (tested to ${r.testedMax ?? "?"}) | ${r.ms} | ${(r.error ?? "").replace(/\|/g, "/")} |`);
              '
            else
              echo "- no report written"
            fi
            if [ -f "$FAKE_REPORT" ]; then
              node -e '
                const rows = JSON.parse(require("fs").readFileSync(process.env.FAKE_REPORT, "utf8"));
                console.log("| driver | CLI version | resumed | new wire offered next turn |");
                console.log("|---|---|---|---|");
                for (const r of rows) console.log(`| ${r.driver} | ${r.cliVersion ?? "?"} | ${r.resumed ? "yes" : "no"} | ${r.newWireReachedModel ? "yes" : "no"} |`);
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"

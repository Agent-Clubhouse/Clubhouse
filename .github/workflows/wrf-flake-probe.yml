name: Throwaway flake probe
on:
  push:
    branches: ['windows-release-flake/probe-tmp']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: node scripts/wrf-raw-windows-semantics.mjs
      - name: Repeat the flow in four contending processes, each with its own env
        shell: bash
        run: |
          probe=src/main/services/framebriar/zz-flake-probe.test.ts
          for o in a b c d; do
            PROBE_MODE=settled PROBE_N=200 PROBE_OUT=probe-$o.jsonl timeout 1080 npx vitest run --project main $probe --reporter=dot 2>&1 | tail -4 &
          done
          wait
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wrf-probe-results
          path: probe-*.jsonl
          if-no-files-found: warn

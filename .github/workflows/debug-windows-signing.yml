name: Debug Windows Signing

# Manual, standalone diagnostic for the Azure Trusted Signing failures that
# have broken the last three release attempts (beta.9/10/11). Squirrel's
# Update.exe swallows signtool.exe's real stdout/stderr and only ever
# reports a generic "Failed to sign" / exit 4294967295 — so this workflow
# calls signtool.exe directly against a throwaway file, with the exact same
# Trusted Signing setup the release workflow uses, and prints whatever
# signtool actually says. Delete once the real root cause is found and
# release.yml is fixed and green again.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  debug-sign:
    name: Debug signtool.exe against Azure Trusted Signing
    runs-on: windows-2022
    environment: release
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Azure Trusted Signing client tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolsDir = Join-Path $env:RUNNER_TEMP "trusted-signing-tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          $nugetPath = Join-Path $toolsDir "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetPath
          & $nugetPath install Microsoft.ArtifactSigning.Client -OutputDirectory $toolsDir -NonInteractive -NoCache

          $dlib = Get-ChildItem -Path $toolsDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib) {
            Write-Error "Could not locate Azure.CodeSigning.Dlib.dll after installing Microsoft.ArtifactSigning.Client"
            exit 1
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Error "Could not locate signtool.exe from the Windows SDK"
            exit 1
          }

          $metadataPath = Join-Path $toolsDir "metadata.json"
          @{
            Endpoint               = "https://wus2.codesigning.azure.net/"
            CodeSigningAccountName = "Clubhouse-Win-Signing"
            CertificateProfileName = "clubhouse-win-codesign"
          } | ConvertTo-Json | Set-Content -Path $metadataPath

          Write-Host "Resolved signtool.exe: $signtool"
          Write-Host "Resolved dlib: $dlib"
          Write-Host "Resolved metadata: $metadataPath"
          Get-Content -Path $metadataPath | Write-Host

          echo "AZURE_SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV
          echo "AZURE_TRUSTED_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          echo "AZURE_TRUSTED_SIGNING_METADATA=$metadataPath" >> $env:GITHUB_ENV

      - name: Sign a throwaway PE file directly with signtool.exe
        shell: pwsh
        run: |
          $testFile = Join-Path $env:RUNNER_TEMP "signing-smoke-test.exe"
          Copy-Item -Path "C:\Windows\System32\notepad.exe" -Destination $testFile -Force

          Write-Host "Invoking signtool.exe directly (bypassing Squirrel entirely) so we can see its real output..."
          Write-Host "----------------------------------------------------------------------"

          & "$env:AZURE_SIGNTOOL_PATH" sign `
            /v `
            /debug `
            /fd SHA256 `
            /tr "http://timestamp.acs.microsoft.com" `
            /td SHA256 `
            /dlib "$env:AZURE_TRUSTED_SIGNING_DLIB" `
            /dmdf "$env:AZURE_TRUSTED_SIGNING_METADATA" `
            "$testFile" 2>&1 | ForEach-Object { Write-Host $_ }

          $exitCode = $LASTEXITCODE
          Write-Host "----------------------------------------------------------------------"
          Write-Host "signtool.exe exit code: $exitCode"

          if ($exitCode -eq 0) {
            Write-Host "Signing succeeded. Verifying signature..."
            & "$env:AZURE_SIGNTOOL_PATH" verify /pa /v "$testFile" 2>&1 | ForEach-Object { Write-Host $_ }
            Write-Host "verify exit code: $LASTEXITCODE"
          } else {
            Write-Error "signtool.exe failed directly (outside Squirrel) with exit code $exitCode — see output above for the real error."
            exit $exitCode
          }

      - name: Sign three files concurrently (reproduce Squirrel's parallel ForEachAsync signing)
        shell: pwsh
        run: |
          # Squirrel.Update.exe signs the packaged exe, Update.exe, and Setup.exe
          # via Squirrel.Utility.ForEachAsync — i.e. several signtool.exe child
          # processes launched in parallel, all authenticating against the same
          # az-cli-backed Trusted Signing credential. AzureCliCredential's MSAL
          # token cache is a single file on disk; concurrent readers/writers
          # racing on that file is a known source of intermittent failures.
          # This reproduces that pattern directly to check if it's the cause.
          $names = 1..3 | ForEach-Object { Join-Path $env:RUNNER_TEMP "signing-concurrency-test-$_.exe" }
          foreach ($n in $names) {
            Copy-Item -Path "C:\Windows\System32\notepad.exe" -Destination $n -Force
          }

          $signtool = $env:AZURE_SIGNTOOL_PATH
          $dlib = $env:AZURE_TRUSTED_SIGNING_DLIB
          $metadata = $env:AZURE_TRUSTED_SIGNING_METADATA

          $jobs = foreach ($n in $names) {
            Start-Job -ScriptBlock {
              param($signtool, $dlib, $metadata, $file)
              $out = & $signtool sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 /dlib "$dlib" /dmdf "$metadata" "$file" 2>&1
              [PSCustomObject]@{ File = $file; ExitCode = $LASTEXITCODE; Output = ($out | Out-String) }
            } -ArgumentList $signtool, $dlib, $metadata, $n
          }

          $results = $jobs | Wait-Job | Receive-Job
          $jobs | Remove-Job

          $anyFailed = $false
          foreach ($r in $results) {
            Write-Host "----------------------------------------------------------------------"
            Write-Host "File: $($r.File)"
            Write-Host "Exit code: $($r.ExitCode)"
            Write-Host $r.Output
            if ($r.ExitCode -ne 0) { $anyFailed = $true }
          }

          if ($anyFailed) {
            Write-Error "At least one concurrent signtool.exe invocation failed — this reproduces Squirrel's parallel-signing failure mode."
            exit 1
          } else {
            Write-Host "All concurrent signtool.exe invocations succeeded."
          }

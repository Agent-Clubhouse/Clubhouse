<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <title>Clubhouse</title>
    <!-- CSP is enforced via HTTP header injected by the main process (production only).
         The %%NONCE%% placeholder is replaced at load time with a per-run random nonce. -->
    <!-- Import map for community plugin ESM imports.
         Plugins use native ESM dynamic import outside webpack, so bare specifiers
         like 'react' must be resolved via import map. These shim files
         re-export from the globalThis references set by the renderer entry. -->
    <script type="importmap" nonce="%%NONCE%%">
    {
      "imports": {
        "react": "./shims/react.js",
        "react-dom": "./shims/react-dom.js",
        "react-dom/client": "./shims/react-dom-client.js",
        "react/jsx-runtime": "./shims/react-jsx-runtime.js"
      }
    }
    </script>
    <script nonce="%%NONCE%%">
      // Flash-prevention: apply cached theme CSS vars before stylesheets load
      (function() {
        try {
          var cached = localStorage.getItem('clubhouse-theme-vars');
          if (cached) {
            var vars = JSON.parse(cached);
            var s = document.documentElement.style;
            for (var k in vars) {
              if (vars.hasOwnProperty(k)) s.setProperty(k, vars[k]);
            }
          }
          var font = localStorage.getItem('clubhouse-theme-font');
          if (font) {
            document.documentElement.classList.add('theme-mono');
          }
          // Experimental: restore font/gradient classes from cached vars
          if (vars && vars['--theme-font-ui']) document.documentElement.classList.add('theme-font-ui');
          if (vars && vars['--theme-font-mono']) document.documentElement.classList.add('theme-font-mono');
          if (vars && vars['--theme-gradient-bg']) document.documentElement.classList.add('theme-gradient-bg');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="h-full m-0 p-0 overflow-hidden">
    <div id="root" class="h-full"></div>
  </body>
</html>
